<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>About — Aleix Jiménez</title>
<style>
@font-face { font-family: "Serif"; src: url(fonts/instrument-serif.woff2) format("woff2"); font-style: normal; }
@font-face { font-family: "Serif"; src: url(fonts/instrument-serif-italic.woff2) format("woff2"); font-style: italic; }
@font-face { font-family: "Sans"; src: url(fonts/switzer-500.woff2) format("woff2"); font-weight: 500; }

:root { --paper: #F2EFE9; --ink: #121110; --m: 84px; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; background: #0f0e0d; overflow: hidden; }
body { color: var(--paper); -webkit-font-smoothing: antialiased; }

.ph { position: absolute; background-size: cover; background-repeat: no-repeat; }
.full { inset: 0; }
.fade { position: absolute; left: 0; right: 0; }

.t { position: absolute; left: var(--m); right: var(--m); }
.big { font-family: "Serif"; font-weight: 400; font-size: 138px; line-height: .94; letter-spacing: -.025em; }
.big em { font-style: italic; }
.small { font-family: "Sans"; font-weight: 500; font-size: 22px; letter-spacing: .28em; text-transform: uppercase; opacity: .82; margin-top: 40px; line-height: 1.9; }
.ink { color: var(--ink); }
#grain { position: absolute; inset: 0; width: 1080px; height: 1920px; opacity: .035; mix-blend-mode: screen; pointer-events: none; }
</style>
</head>
<body>
<div id="frame"></div>
<canvas id="grain" width="540" height="960"></canvas>
<script>
/* Una foto. Una frase. Nada más. */
const STORIES = {
  /* 01 — Portada: nombre en tinta sobre el mármol */
  1: `
    <div class="ph full" style="background-image:url(img/corridor.jpg); background-position: 30% 50%"></div>
    <div class="t ink" style="top: 316px; text-align: right">
      <div class="big" style="font-size: 112px">Aleix<br><em>Jiménez</em></div>
    </div>`,

  /* 02 — Origen: taller arriba, obra abajo */
  2: `
    <div class="ph" style="left:0; top:0; width:1080px; height:956px; background-image:url(img/workshop.jpg); background-position: 50% 40%"></div>
    <div class="ph" style="left:0; top:964px; width:1080px; height:956px; background-image:url(img/hardhat.jpg); background-position: 50% 42%"></div>
    <div class="fade" style="top:0; height:760px; background: linear-gradient(180deg, rgba(10,10,9,.78) 0%, rgba(10,10,9,.45) 55%, rgba(10,10,9,0) 100%)"></div>
    <div class="t" style="top: 300px">
      <div class="big">Crecí entre<br><em>aluminio y obra.</em></div>
      <div class="small">Empresa familiar · Carpintería de aluminio</div>
    </div>`,

  /* 03 — Lo que vi */
  3: `
    <div class="ph full" style="background-image:url(img/galleria.jpg); background-position: 50% 40%"></div>
    <div class="fade" style="bottom:0; height:900px; background: linear-gradient(0deg, rgba(10,10,9,.82) 0%, rgba(10,10,9,.5) 50%, rgba(10,10,9,0) 100%)"></div>
    <div class="t" style="bottom: 300px">
      <div class="big">Años de obra.<br><em>Y se vende<br>con un render.</em></div>
    </div>`,

  /* 04 — Prospectus: la experiencia real de Villa Aurea, tal como se ve en el móvil */
  4: `
    <div class="ph full" style="background-image:url(img/villa-aurea-mobile.jpg)"></div>
    <div class="t ink" style="top: 400px">
      <div class="big">Hoy,<br><em>Prospectus.</em></div>
      <div class="small" style="opacity: .62">Cofundador · Promociones en 3D</div>
    </div>`,

  /* 05 — Enfoque */
  5: `
    <div class="ph full" style="background-image:url(img/window.jpg); background-position: 50% 50%"></div>
    <div class="fade" style="bottom:0; height:860px; background: linear-gradient(0deg, rgba(10,10,9,.85) 0%, rgba(10,10,9,.5) 50%, rgba(10,10,9,0) 100%)"></div>
    <div class="t" style="bottom: 300px">
      <div class="big">Primero, entender<br><em>el negocio.</em></div>
      <div class="small">Comercialización · 3D · Consultoría</div>
    </div>`,

  /* 06 — Hacia dónde */
  6: `
    <div class="ph full" style="background-image:url(img/duomo.jpg); background-position: 50% 50%"></div>
    <div class="fade" style="bottom:0; height:860px; background: linear-gradient(0deg, rgba(10,10,9,.85) 0%, rgba(10,10,9,.5) 50%, rgba(10,10,9,0) 100%)"></div>
    <div class="t" style="bottom: 300px">
      <div class="big">Vender mejor<br><em>lo que se construye.</em></div>
    </div>`,

  /* 07 — Hablemos */
  7: `
    <div class="ph full" style="background-image:url(img/night.jpg); background-size: 1188px 2112px; background-position: 50% 130px"></div>
    <div class="fade" style="top:0; height:760px; background: linear-gradient(180deg, #0f0e0d 0%, #0f0e0d 15%, rgba(10,10,9,.55) 45%, rgba(10,10,9,0) 100%)"></div>
    <div class="t" style="top: 300px">
      <div class="big" style="font-size: 190px"><em>Hablemos.</em></div>
      <div class="small">DM · @aleixjimenezz_<br>WhatsApp · 633 716 169</div>
    </div>`,
};

const n = parseInt(new URLSearchParams(location.search).get("n") || "1", 10);
document.getElementById("frame").innerHTML = STORIES[n];

// grano casi imperceptible: da textura de foto, no de filtro
const gc = document.getElementById("grain").getContext("2d");
const gimg = gc.createImageData(540, 960);
let seed = 12345;
for (let i = 0; i < gimg.data.length; i += 4) {
  seed ^= seed << 13; seed >>>= 0; seed ^= seed >>> 17; seed ^= seed << 5; seed >>>= 0;
  gimg.data[i] = gimg.data[i + 1] = gimg.data[i + 2] = seed & 255; gimg.data[i + 3] = 255;
}
gc.putImageData(gimg, 0, 0);

window.DURATION = 1;
window.render = () => {};
window.ready = document.fonts.ready.then(() => Promise.all(
  [...document.querySelectorAll(".ph")].map(el => new Promise(res => {
    const m = /url\(["']?(.*?)["']?\)/.exec(el.style.backgroundImage);
    if (!m) return res();
    const i = new Image(); i.onload = i.onerror = res; i.src = m[1];
  }))
));
</script>
</body>
</html>
