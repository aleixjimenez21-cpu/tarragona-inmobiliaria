.rule { position: absolute; left: var(--m); right: var(--m); height: 1px; background: var(--hair); transform-origin: left center; }

/* ═════════════════════════════════════════════════════════════
   MOTOR — render(t) determinista
   ═════════════════════════════════════════════════════════════ */
const n = parseInt(new URLSearchParams(location.search).get("n") || "1", 10);
const S = STORIES[n];
const frame = document.getElementById("frame");
frame.innerHTML = `
  ${S.bg ? `<div class="bg" id="bg" style="background-image:url(${S.bg})"></div>` : ""}
  ${S.model ? `<canvas id="model" width="2160" height="1800" style="position:absolute; left:0; top:250px; width:1080px; height:900px"></canvas>` : ""}
  ${S.shade ? `<div class="shade" style="background:${S.shade}"></div>` : ""}
  <div class="vignette"></div>
  <div class="top" data-a="fade" data-d=".15"><span>About</span><span class="n">${String(n).padStart(2,"0")} <i>/ ${String(TOTAL).padStart(2,"0")}</i></span></div>
  <div class="rule" data-a="line" data-d=".1" style="top: 290px"></div>
  ${S.html}`;

const clamp = (x) => Math.max(0, Math.min(1, x));
const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inOutCubic = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const inOutSine = (x) => -(Math.cos(Math.PI * x) - 1) / 2;

const els = [...frame.querySelectorAll("[data-a]")];
const kbs = [...frame.querySelectorAll("[data-kb]")];

function render(t) {
  // fondo: entrada desde negro + movimiento de cámara lento
  const bg = document.getElementById("bg");
  if (bg) {
    const p = inOutSine(clamp(t / S.dur));
    const s = S.kb[0] + (S.kb[1] - S.kb[0]) * p;
    const px = S.pan[0] * p, py = S.pan[1] * p + (S.offY || 0);
    bg.style.transform = `translate(${px}px, ${py}px) scale(${s})`;
    bg.style.opacity = (S.bgOpacity ?? 1) * outCubic(clamp(t / 1.4));
  }
  for (const k of kbs) {
    const [a, b] = k.dataset.kb.split(",").map(Number);
    const p = inOutSine(clamp(t / S.dur));
    k.style.transform = `scale(${a + (b - a) * p})`;
  }
  for (const el of els) {
    const d = parseFloat(el.dataset.d || 0);
    const a = el.dataset.a;
    if (a === "mask") {
      const p = outExpo(clamp((t - d) / 1.3));
      el.firstElementChild.style.transform = `translateY(${(1 - p) * 108}%)`;
    } else if (a === "fade") {
      const p = outCubic(clamp((t - d) / 1.1));
      el.style.opacity = p;
      el.style.transform = `translateY(${(1 - p) * 22}px)`;
    } else if (a === "line") {
      const p = inOutCubic(clamp((t - d) / 1.5));
      if (el.classList.contains("rule")) el.style.transform = `scaleX(${p})`;
      else el.style.borderTopColor = `rgba(232,227,217,${.22 * p})`;
    } else if (a === "reveal") {
      const p = outExpo(clamp((t - d) / 1.8));
      el.style.clipPath = `inset(${(1 - p) * 100}% 0 0 0)`;
    }
  }
  if (S.model) drawModel(t);
  drawGrain(t);
}

/* ── grano de película (semilla por fotograma: reproducible) ── */
const gc = document.getElementById("grain").getContext("2d");
const gimg = gc.createImageData(540, 960);
function drawGrain(t) {
  let seed = ((Math.floor(t * 10) + 1) * 2654435761) >>> 0 || 1;
  const d = gimg.data;
  for (let i = 0; i < d.length; i += 4) {
    seed ^= seed << 13; seed >>>= 0; seed ^= seed >>> 17; seed ^= seed << 5; seed >>>= 0;
    const v = seed & 255;
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
  }
  gc.putImageData(gimg, 0, 0);
}

/* ── 05: edificio en 3D que se construye planta a planta ── */
function drawModel(t) {
  const cv = document.getElementById("model");
  const c = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, W, H);
  c.setTransform(2, 0, 0, 2, 0, 0); // dibujamos en coordenadas de 1080×900

  const BW = 15, BD = 7, FLOORS = 9, FH = 3.1, BAY = 5;
  const ang = (28 + 24 * inOutSine(clamp(t / S.dur))) * Math.PI / 180;
  const R = 66, CAMY = 17, TY = 12.5, F = 1080, CX = 500, CY = 440;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  // cámara orbitando alrededor del eje Y mirando al objetivo
  const cam = [R * sa, CAMY, R * ca];
  const fwd = norm([-cam[0], TY - cam[1], -cam[2]]);
  const right = norm(cross(fwd, [0, 1, 0]));
  const up = cross(right, fwd);
  function proj(p) {
    const v = [p[0] - cam[0], p[1] - cam[1], p[2] - cam[2]];
    const x = dot(v, right), y = dot(v, up), z = dot(v, fwd);
    return [CX + F * x / z, CY - F * y / z, z];
  }
  function seg(a, b, alpha, prog = 1, w = 1.1) {
    if (prog <= 0) return;
    const pa = proj(a), pb = proj(b);
    const ex = pa[0] + (pb[0] - pa[0]) * prog, ey = pa[1] + (pb[1] - pa[1]) * prog;
    const depth = clamp(1.3 - ((pa[2] + pb[2]) / 2 - 45) / 45);
    c.strokeStyle = `rgba(232,227,217,${alpha * (.45 + .55 * depth)})`;
    c.lineWidth = w;
    c.beginPath(); c.moveTo(pa[0], pa[1]); c.lineTo(ex, ey); c.stroke();
  }
  const rect = (y, x0, x1, z0, z1, alpha, prog = 1, w) => {
    const pts = [[x0, y, z0], [x1, y, z0], [x1, y, z1], [x0, y, z1]];
    for (let i = 0; i < 4; i++) seg(pts[i], pts[(i + 1) % 4], alpha, clamp(prog * 4 - i), w);
  };

  const P = clamp((t - .3) / 3.6); // progreso de obra

  // parcela y retícula del suelo
  const g = clamp(P / .22);
  for (let x = -30; x <= 30; x += 5) seg([x, 0, -16], [x, 0, 16], .07, g, .8);
  for (let z = -15; z <= 15; z += 5) seg([-30, 0, z], [30, 0, z], .07, g, .8);
  rect(0, -26, 26, -13, 13, .28, g, 1);

  // pilares: suben
  const colP = clamp((P - .12) / .35);
  const H_ = FLOORS * FH;
  for (let x = -BW; x <= BW + .01; x += BAY) {
    for (const z of [-BD, BD]) seg([x, 0, z], [x, H_, z], .5, colP, 1.1);
  }
  // forjados + balcones, planta a planta
  for (let f = 0; f <= FLOORS; f++) {
    const fp = clamp((P - .3 - f * .075) / .12);
    if (fp <= 0) continue;
    const y = f * FH;
    rect(y, -BW, BW, -BD, BD, f === FLOORS ? .85 : .62, fp, f === 0 || f === FLOORS ? 1.4 : 1.1);
    if (f > 0 && f < FLOORS) {
      for (let b = 0; b < BW * 2 / BAY; b++) {
        if ((b + f) % 2) continue; // balcones alternos: fachada rítmica
        const x0 = -BW + b * BAY + .6, x1 = x0 + BAY - 1.2;
        seg([x0, y, BD], [x0, y, BD + 1.7], .55, fp);
        seg([x0, y, BD + 1.7], [x1, y, BD + 1.7], .55, fp);
        seg([x1, y, BD + 1.7], [x1, y, BD], .55, fp);
        seg([x0, y + 1.05, BD + 1.7], [x1, y + 1.05, BD + 1.7], .3, fp, .9); // barandilla
      }
    }
  }
  // remate de cubierta
  const rp = clamp((P - .92) / .08);
  rect(H_ + .9, -BW, BW, -BD, BD, .35, rp, 1);
  for (const [x, z] of [[-BW, -BD], [BW, -BD], [BW, BD], [-BW, BD]]) seg([x, H_, z], [x, H_ + .9, z], .35, rp);

  // vivienda destacada (interactividad)
  const hp = outCubic(clamp((t - 4.4) / 1.0));
  if (hp > 0) {
    const f = 4, y0 = (f - 1) * FH, y1 = f * FH, x0 = -5, x1 = 0, z0 = 0, z1 = BD;
    const faces = [
      [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]],
      [[x1, y0, z0], [x1, y0, z1], [x1, y1, z1], [x1, y1, z0]],
      [[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]],
    ];
    c.fillStyle = `rgba(232,227,217,${.13 * hp})`;
    for (const fc of faces) {
      c.beginPath();
      fc.forEach((p, i) => { const q = proj(p); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); });
      c.closePath(); c.fill();
    }
    const edges = [[[x0,y0,z1],[x1,y0,z1]],[[x1,y0,z1],[x1,y1,z1]],[[x1,y1,z1],[x0,y1,z1]],[[x0,y1,z1],[x0,y0,z1]],
                   [[x1,y0,z0],[x1,y0,z1]],[[x1,y1,z0],[x1,y1,z1]],[[x1,y0,z0],[x1,y1,z0]],[[x0,y1,z0],[x1,y1,z0]],[[x0,y1,z0],[x0,y1,z1]]];
    for (const [a, b] of edges) seg(a, b, .95 * hp, 1, 1.6);

    // punto + línea guía + etiqueta
    const anchor = proj([x1, (y0 + y1) / 2, z1 + .01]);
    const lp = outExpo(clamp((t - 4.9) / 1.2));
    const tx = 996, ty = anchor[1] - 190;
    const pulse = .5 + .5 * Math.sin(t * 3.2);
    c.fillStyle = `rgba(232,227,217,${hp})`;
    c.beginPath(); c.arc(anchor[0], anchor[1], 5, 0, Math.PI * 2); c.fill();
    c.strokeStyle = `rgba(232,227,217,${.45 * hp * (1 - pulse * .6)})`;
    c.lineWidth = 1;
    c.beginPath(); c.arc(anchor[0], anchor[1], 10 + pulse * 10, 0, Math.PI * 2); c.stroke();
    if (lp > 0) {
      const mx = anchor[0] + (tx - 70 - anchor[0]) * .55, my = ty;
      c.strokeStyle = "rgba(232,227,217,.7)";
      c.beginPath(); c.moveTo(anchor[0], anchor[1]);
      const p1 = Math.min(1, lp * 2), p2 = clamp(lp * 2 - 1);
      const ax = anchor[0] + (mx - anchor[0]) * p1, ay = anchor[1] + (my - anchor[1]) * p1;
      c.lineTo(ax, ay);
      if (p2 > 0) c.lineTo(mx + (tx - mx) * p2, my);
      c.stroke();
      c.globalAlpha = clamp((t - 5.6) / .7);
      c.fillStyle = "#E8E3D9";
      c.textAlign = "right";
      c.font = "italic 40px Serif";
      c.fillText("Vivienda 3ºB", tx, ty - 18);
      c.font = "500 15px Sans";
      c.fillStyle = "rgba(232,227,217,.6)";
      c.letterSpacing = "4px";
      c.fillText("RECORRER EN 3D  →", tx, ty + 36);
      c.letterSpacing = "0px";
      c.globalAlpha = 1;
    }
  }
}
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
function norm(a) { const l = Math.hypot(...a); return [a[0] / l, a[1] / l, a[2] / l]; }

window.render = render;
window.DURATION = S.dur;
window.ready = document.fonts.ready.then(() => Promise.all(
  [...document.querySelectorAll(".bg,[data-kb]")].map(el => new Promise(res => {
    const m = /url\(["']?(.*?)["']?\)/.exec(el.style.backgroundImage || el.style.background);
    if (!m) return res();
    const i = new Image(); i.onload = i.onerror = res; i.src = m[1];
  }))
)).then(() => render(0));
</script>
