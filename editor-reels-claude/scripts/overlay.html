<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Prospectus BF overlay</title>
<style>
  /* Estilo de referencia: palabra grande detrás de la cabeza + tarjetas de cristal. Inter Display, minúsculas. */
  :root { --acc: #9CC3E2; --deep: #5A8BB5; --W: 1080px; --H: 1920px; --ink: #1d1e21; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { width: var(--W); height: var(--H); position: relative; overflow: hidden; font-family: 'Inter Display', 'Inter', sans-serif;
         color: #fff; -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .abs { position: absolute; }
  body[data-layer="back"] .front { display: none !important; }
  body[data-layer="front"] .back { display: none !important; }
  body[data-layer="front"] #behind .big { visibility: hidden; }   /* la palabra grande va detrás de la cabeza */
  body[data-layer="back"] #behind .small { visibility: hidden; }  /* la frase pequeña va delante: nunca se tapa */

  /* ---------- capa trasera: frase pequeña + palabra grande */
  #behind { left: 0; right: 0; text-align: center; }
  #behind .small { font-weight: 400; font-size: 54px; letter-spacing: -0.5px; color: var(--ink); line-height: 1.1; padding: 0 70px;
                  text-shadow: 0 0 14px rgba(255,255,255,.75), 0 0 30px rgba(255,255,255,.45); }
  #behind .big { display: inline-block; font-weight: 600; letter-spacing: -0.045em; line-height: .86; color: var(--deep); white-space: nowrap; margin-top: 6px; }
  #behind .big img { display: block; margin: 0 auto; }
  #behind.ondark .small { color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,.35); }
  #behind.ondark .big { color: var(--acc); }

  /* ---------- cristal (el desenfoque real del vídeo lo hace compose.py en estos rectángulos) */
  .glass { background: rgba(22,23,27,.46); border: 1.5px solid rgba(255,255,255,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 18px 50px rgba(0,0,0,.18); }

  /* ---------- subtítulos en tarjeta de cristal */
  #subs { left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 22px; padding: 22px 34px 22px 22px; border-radius: 30px;
          max-width: 940px; box-sizing: border-box; white-space: nowrap; }
  #subs .ico { width: 58px; height: 58px; border-radius: 16px; background: rgba(255,255,255,.12); display: grid; place-items: center; flex: none; }
  #subs .ico svg { width: 30px; height: 30px; }
  #subs .txt { font-weight: 500; font-size: 46px; letter-spacing: -0.4px; color: rgba(255,255,255,.62); }
  #subs .w { display: inline-block; margin: 0 6px 0 0; }
  #subs .w.said { color: #fff; }
  #subs .w.on { color: var(--acc); }

  /* ---------- cuenta atrás */
  #count { display: flex; align-items: center; gap: 12px; padding: 13px 24px 13px 18px; border-radius: 100px; font-weight: 500; font-size: 29px;
           font-variant-numeric: tabular-nums; letter-spacing: .2px; }
  #count .lbl { color: rgba(255,255,255,.66); font-weight: 400; }

  /* ---------- chip del proyecto */
  #chip { display: flex; align-items: center; gap: 12px; padding: 12px 22px 12px 16px; border-radius: 100px; font-weight: 500; font-size: 26px; }
  #chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--acc); }

  /* ---------- panel de cierre */
  #endpanel { left: 50%; width: 880px; margin-left: -440px; border-radius: 34px; padding: 30px 36px 34px; box-sizing: border-box; text-align: center; }
  #endpanel .l1 { font-weight: 600; font-size: 58px; letter-spacing: -1.2px; }
  #endpanel .l2 { font-weight: 300; font-size: 33px; color: rgba(255,255,255,.85); margin-top: 6px; }
  .cta { display: inline-flex; align-items: center; gap: 16px; background: #fff; color: #111; font-weight: 600; font-size: 40px; letter-spacing: -0.4px;
         padding: 22px 42px; border-radius: 100px; box-shadow: 0 14px 40px rgba(0,0,0,.25); }
  #endpanel .cta { margin-top: 24px; }

  /* ---------- tarjeta final */
  #endcard { left: 0; top: 0; width: var(--W); height: var(--H); }
  #endcard .bg { position: absolute; inset: 0; background: radial-gradient(120% 70% at 50% 45%, rgba(14,15,18,.70), rgba(14,15,18,.93)); }
  #endcard .inner { position: absolute; left: 70px; right: 70px; text-align: center; }
  #endcard .brandtxt { font-weight: 700; font-size: 84px; letter-spacing: -2px; }
  #endcard .sub { font-weight: 300; font-size: 30px; color: rgba(255,255,255,.7); margin-top: 18px; }
  #endcard .tag { font-weight: 300; font-size: 50px; margin-top: 80px; letter-spacing: -0.3px; }
  #endcard .big { font-weight: 600; font-size: 270px; line-height: .9; color: var(--acc); letter-spacing: -0.05em; }
  #endcard .plaza { font-weight: 600; font-size: 66px; letter-spacing: -1.2px; margin-top: 12px; }
  #endcard .rule { width: 110px; height: 2px; background: rgba(255,255,255,.22); margin: 36px auto; }
  #endcard .dl { font-weight: 300; font-size: 38px; line-height: 1.3; color: rgba(255,255,255,.88); }
  #endcard .dl b { font-weight: 600; color: #fff; }
  #endcard .cta { margin-top: 56px; font-size: 46px; padding: 26px 50px; }
</style>
</head>
<body data-layer="front">
  <div id="behind" class="abs"><div class="small"></div><div class="big"></div></div>

  <div id="chip" class="abs front glass"><span class="dot"></span><span class="txt"></span></div>
  <div id="endpanel" class="abs front glass">
    <div class="l1" data-t="panel_l1"></div>
    <div class="l2" data-t="panel_l2"></div>
    <div class="cta"><span class="ctatxt"></span><span>→</span></div>
  </div>
  <div id="endcard" class="abs front">
    <div class="bg"></div>
    <div class="inner">
      <div class="brandwrap"><img id="endlogo" class="logo" src="../input/brand/logo_blanco_hd.png" style="width:470px;display:block;margin:0 auto"
           onerror="this.outerHTML='<div class=&quot;brandtxt&quot;>'+(window.__brand||'')+'</div>'"></div>
      <div class="sub" data-t="end_sub"></div>
      <div class="tag" data-t="end_tag"></div>
      <div class="big" data-t="end_big"></div>
      <div class="plaza" data-t="end_line"></div>
      <div class="rule"></div>
      <div class="dl" data-t="end_deadline"></div>
      <div class="cta"><span class="ctatxt"></span><span>→</span></div>
    </div>
  </div>
  <div id="subs" class="abs front glass"><div class="ico"></div><div class="txt"></div></div>
  <div id="count" class="abs front glass"><svg width="24" height="28" viewBox="0 0 26 30"><path d="M4 2h18M4 28h18M6 2c0 8 7 9 7 13s-7 5-7 13M20 2c0 8-7 9-7 13s7 5 7 13" fill="none" stroke="#9CC3E2" stroke-width="2.4" stroke-linecap="round"/><path d="M9 25.5c1.5-2.5 6.5-2.5 8 0z" fill="#9CC3E2"/></svg><span class="lbl" data-t="badge_label"></span><span class="v" data-t="badge_value"></span></div>

<script>
let P = null, L = null, HT = {};
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const eo = (x) => 1 - Math.pow(1 - clamp(x), 3);
const ICONS = {
  house: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  tag: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="8" cy="8" r="1.6" fill="#fff"/></svg>',
  cube: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
};

const LAYOUTS = {
  '9x16': { W: 1080, H: 1920, subsY: 1440, countTop: 286, countRight: 44, chipLeft: 48, chipTop: 1290, endPanelTop: 1075, endInnerTop: 380, minTop: 362 },
  '4x5':  { W: 1080, H: 1350, subsY: 1225, countTop: 36, countRight: 36, chipLeft: 40, chipTop: 1110, endPanelTop: 800, endInnerTop: 70, minTop: 100 },
};

function setup(plan, fmt, headtops) {
  P = plan; L = LAYOUTS[fmt]; HT = headtops || {};
  const r = document.documentElement.style;
  r.setProperty('--W', L.W + 'px'); r.setProperty('--H', L.H + 'px'); r.setProperty('--acc', plan.accent); r.setProperty('--deep', plan.accent_deep);
  document.querySelectorAll('.ctatxt').forEach(e => e.textContent = plan.cta.toLowerCase());
  // textos de la tarjeta final, el panel de cierre y el rótulo de arriba (plan["texts"]); vacíos -> se ocultan
  const T = plan.texts || {};
  window.__brand = T.brand || '';
  document.querySelectorAll('[data-t]').forEach(e => { const v = T[e.dataset.t]; if (v) e.innerHTML = v; else e.style.display = 'none'; });
  if (!T.badge_label && !T.badge_value) $('count').style.visibility = 'hidden';
  if (!T.end_line && !T.end_deadline) document.querySelector('#endcard .rule').style.display = 'none';
  $('count').style.top = L.countTop + 'px'; $('count').style.right = L.countRight + 'px';
  $('chip').style.left = L.chipLeft + 'px'; $('chip').style.top = L.chipTop + 'px';
  $('endpanel').style.top = L.endPanelTop + 'px';
  document.querySelector('#endcard .inner').style.top = L.endInnerTop + 'px';
  if (fmt === '4x5') {
    const ec = $('endcard');
    $('endlogo').style.width = '380px';
    ec.querySelector('.tag').style.marginTop = '40px';
    ec.querySelector('.big').style.fontSize = '210px';
    ec.querySelector('.rule').style.margin = '22px auto';
    ec.querySelector('.cta').style.marginTop = '34px';
    $('endpanel').style.transform = 'scale(.9)';
  }
  P._subs = P.subs.map(s => s.words.map(w => ({ ...w, txt: w.w.toLowerCase().replace(/[,.]$/, '') })));
  const imgs = [...document.querySelectorAll('img')].map(i => i.complete ? Promise.resolve() : new Promise(r => { i.onload = i.onerror = r; }));
  Promise.all([document.fonts.load('600 100px "Inter Display"'), document.fonts.load('300 50px "Inter Display"'), document.fonts.load('500 50px "Inter Display"'), ...imgs])
    .then(() => { window.__ready = true; });
}

function fmtCount(t) {
  const end = new Date(P.deadline).getTime(), start = new Date(P.publish).getTime();
  let s = Math.max(0, Math.floor((end - start) / 1000 - t));
  const d = Math.floor(s / 86400); s -= d * 86400; const h = Math.floor(s / 3600); s -= h * 3600; const m = Math.floor(s / 60); s -= m * 60;
  return `${d}d ${h}h ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s`;
}

function iconFor(t) {
  // plan["icons"] = [[t0, "house"|"tag"|"cube"|"clock"|"chat"], ...] (ordenado); si no, por tomas
  if (P.icons && P.icons.length) { let ic = P.icons[0][1]; for (const [t0, n] of P.icons) if (t >= t0) ic = n; return ic; }
  const C = P.cues;
  const st = (k) => P.segments.find(s => s[0] === k)[3];   // inicio del primer tramo de cada toma
  if (t < st('B')) return 'house';
  if (t < st('C')) return 'tag';
  if (t < st('D')) return 'cube';
  if (t < C.end_panel) return 'clock';
  return 'chat';
}

let _lastBehind = null;
function layoutBehind(b) {
  // tamaño de la palabra grande: lo más grande posible dentro de 960 px de ancho
  const el = $('behind'), big = el.querySelector('.big'), small = el.querySelector('.small');
  small.textContent = b.small;
  if (b.big === '@logo') {
    big.innerHTML = '<img class="logo" src="../input/brand/logo_negro_hd.png" style="width:900px" onerror="this.outerHTML=window.__brand||\'\'">';
    big.style.fontSize = '';
  } else {
    big.textContent = b.big;
    let fs = 400; big.style.fontSize = fs + 'px';
    while (big.getBoundingClientRect().width > 980 && fs > 80) { fs -= 4; big.style.fontSize = fs + 'px'; }
  }
  // colocación: la cabeza tapa ~45 % de la parte baja de la palabra grande
  const ht = HT[b.id];
  const bigH = big.getBoundingClientRect().height, smallH = small.getBoundingClientRect().height;
  let bigTop = ht ? ht.top - bigH * (1 - (b.cover != null ? b.cover : 0.45)) : 380;   // cover = fracción de la palabra que tapa la cabeza
  bigTop = Math.max(bigTop, L.minTop + smallH + 6);
  el.style.top = (bigTop - smallH - 6) + 'px';
  _lastBehind = b.id;
}

function render(t, layer) {
  document.body.dataset.layer = layer;
  const C = P.cues;
  const glass = [];
  // ---- palabras detrás de la cabeza
  {
    let cur = null; for (const b of P.behind) if (t >= b.t0 && t < b.t1) cur = b;
    const el = $('behind');
    el.style.display = cur ? 'block' : 'none';
    if (cur) {
      if (_lastBehind !== cur.id) layoutBehind(cur);
      const small = el.querySelector('.small'), big = el.querySelector('.big');
      if (cur.small2) small.textContent = t >= cur.small2[0] ? cur.small2[1] : cur.small;
      const first = cur.t0 <= 0.001;   // el gancho se ve completo desde el primer fotograma
      const kin = first ? 1 : eo((t - cur.t0) / 0.38), kout = clamp((cur.t1 - t) / 0.14);
      const ks = first ? 1 : eo((t - cur.t0 - 0.06) / 0.3);
      small.style.opacity = ks * kout;
      small.style.transform = `translateY(${(1 - ks) * 14}px)`;
      big.style.opacity = kin * kout;
      big.style.transform = `scale(${1.08 - 0.08 * kin})`;
      big.style.filter = `blur(${(1 - kin) * 10}px)`;
      // sobre clips del tour (sin persona) se usa la versión clara del color
      const e = P.video.find(v => t >= v.t0 && t < v.t1);
      el.classList.toggle('ondark', false);   // los clips bajo estos rótulos son claros: se mantiene el azul profundo
    }
  }
  // ---- chip del proyecto
  {
    let cur = null; for (const c of C.chip) if (t >= c[0] && t < c[1]) cur = c;
    $('chip').style.display = cur ? 'flex' : 'none';
    if (cur) {
      $('chip').querySelector('.txt').textContent = cur[2].toLowerCase();
      const o = clamp(Math.min((t - cur[0]) / 0.15, (cur[1] - t) / 0.1));
      $('chip').style.opacity = o;
      if (layer === 'front' && o > 0.02) glass.push(rect($('chip'), 100, o));
    }
  }
  // ---- panel de cierre
  {
    const a = C.end_panel, b = C.end_full + 0.1;
    const vis = t >= a && t <= b + 0.25;
    $('endpanel').style.display = vis ? 'block' : 'none';
    if (vis) {
      const k = eo((t - a) / 0.4);
      const o = clamp((t - a) / 0.16) * clamp((b + 0.25 - t) / 0.25);
      $('endpanel').style.opacity = o;
      $('endpanel').style.marginTop = ((1 - k) * 50) + 'px';
      const cta = $('endpanel').querySelector('.cta'); const p = t - a - 0.6;
      cta.style.transform = `scale(${1 + (p > 0 ? 0.03 * Math.sin(p * 2 * Math.PI / 1.1) : 0)})`;
      if (layer === 'front' && o > 0.02) glass.push(rect($('endpanel'), 34, o));
    }
  }
  // ---- tarjeta final
  {
    const a = C.end_full; const vis = t >= a;
    $('endcard').style.display = vis ? 'block' : 'none';
    if (vis) {
      const ec = $('endcard');
      ec.querySelector('.bg').style.opacity = clamp((t - a) / 0.3);
      const parts = ec.querySelectorAll('.inner > *');
      parts.forEach((el, i) => { const k = eo((t - a - 0.05 - i * 0.05) / 0.4); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 24}px)`; });
      const cta = ec.querySelector('.cta'); const p = t - a - 0.8; const k = eo((t - a - 0.05 - 7 * 0.05) / 0.4);
      cta.style.transform = `translateY(${(1 - k) * 24}px) scale(${1 + (p > 0 ? 0.035 * Math.sin(p * 2 * Math.PI / 1.1) : 0)})`;
    }
  }
  // ---- subtítulos en tarjeta de cristal
  {
    let idx = -1;
    for (let i = 0; i < P.subs.length; i++) if (t >= P.subs[i].t0 && t < P.subs[i].t1) idx = i;
    const el = $('subs');
    const first = P.subs[0].t0, last = P.subs[P.subs.length - 1].t1;
    const on = t >= first && t < Math.min(last, C.end_full + 0.1);
    el.style.display = on ? 'flex' : 'none';
    if (on) {
      el.querySelector('.ico').innerHTML = ICONS[iconFor(t)];
      const ws = idx >= 0 ? P._subs[idx] : [];
      el.querySelector('.txt').innerHTML = ws.map(w => {
        const cls = 'w' + (t >= w.s - 0.03 && t < Math.max(w.e, w.s + 0.12) + 0.02 ? ' on' : (t >= w.s ? ' said' : ''));
        return `<span class="${cls}">${w.txt}</span>`;
      }).join(' ') || '&nbsp;';
      const h = el.getBoundingClientRect().height;
      el.style.top = (L.subsY - h / 2) + 'px';
      const o = clamp(Math.min((t - first) / 0.2, (C.end_full + 0.1 - t) / 0.15));
      el.style.opacity = o;
      if (layer === 'front' && o > 0.02) glass.push(rect(el, 30, o));
    }
  }
  // ---- cuenta atrás
  if (layer === 'front') glass.push(rect($('count'), 100, 1));
  return glass;
}

function rect(el, r, o) {
  const b = el.getBoundingClientRect();
  return { x: Math.round(b.left), y: Math.round(b.top), w: Math.round(b.width), h: Math.round(b.height), r, o: +o.toFixed(3) };
}
window.setup = setup; window.render = render;
</script>
</body>
</html>
